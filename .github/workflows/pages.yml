name: Publish portfolio preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html style.css app.js i18n.js _site/
          cp -r assets _site/
          node --check _site/app.js
          node --check _site/i18n.js
          node scripts/check-static.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
